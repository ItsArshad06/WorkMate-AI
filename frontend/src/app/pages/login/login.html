<div class="page">

    <!-- Animated Background -->

    <div class="background">

        <div class="blob blob1"></div>
        <div class="blob blob2"></div>
        <div class="blob blob3"></div>

        <div class="glass-wave wave1"></div>
        <div class="glass-wave wave2"></div>

        <div class="bubble b1"></div>
        <div class="bubble b2"></div>
        <div class="bubble b3"></div>
        <div class="bubble b4"></div>
        <div class="bubble b5"></div>

    </div>

    <div class="content">

        <div class="logo">

            <span class="logo-workmate">WorkMate</span>
            <span class="logo-ai">AI</span>

        </div>

        <p class="tagline">

            Enterprise Workforce Intelligence

        </p>

        <div class="network">

            <div class="center-node">

                <div class="pulse"></div>

                <div class="core">AI</div>

            </div>

            <div class="line line1"></div>
            <div class="line line2"></div>
            <div class="line line3"></div>
            <div class="line line4"></div>
            <div class="line line5"></div>

            <div class="node employee">Employees</div>
            <div class="node attendance">Attendance</div>
            <div class="node leave">Leave</div>
            <div class="node reports">Reports</div>
            <div class="node analytics">Analytics</div>

        </div>

        <div class="login-card">

            <h2>Welcome Back</h2>

            <p>

                Sign in to continue to your AI workspace

            </p>

            <div class="input-group">

                <label>Username</label>

                <input
                    type="text"
                    placeholder="admin"
                    [(ngModel)]="username">

            </div>

            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    placeholder="Enter Password"
                    [(ngModel)]="password">

            </div>

            <div class="login-options">

                <label>

                    <input type="checkbox">

                    Remember Me

                </label>

                <a href="#">

                    Forgot Password?

                </a>

            </div>

            <button
                (click)="login()"
                [disabled]="loading">

                {{ loading ? 'Signing In...' : 'Access Workspace →' }}

            </button>

        </div>

        <div class="footer-text">

            © 2026 WorkMate AI

        </div>

    </div>

</div>
