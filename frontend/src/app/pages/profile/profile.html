<div class="profile-page">

    <div class="page-header">
        <h1>My Profile</h1>
        <p>Manage your employee information</p>
    </div>

    <div class="profile-card">

        <div class="profile-left">

            <img [src]="profile.avatar" alt="Profile">

            <h2>{{ profile.full_name }}</h2>

            <p>{{ profile.role }}</p>

            <p>{{ profile.department }}</p>

        </div>

        <div class="profile-right">

            <div class="form-grid">

                <label>Employee ID</label>
                <input [(ngModel)]="profile.employee_id" disabled>

                <label>Full Name</label>
                <input [(ngModel)]="profile.full_name" [disabled]="!isEditing">

                <label>Email</label>
                <input [(ngModel)]="profile.email" [disabled]="!isEditing">

                <label>Phone</label>
                <input [(ngModel)]="profile.phone" [disabled]="!isEditing">

                <label>Department</label>
                <input [(ngModel)]="profile.department" [disabled]="!isEditing">

                <label>Role</label>
                <input [(ngModel)]="profile.role" [disabled]="!isEditing">

                <label>Joining Date</label>
                <input [(ngModel)]="profile.joining_date" disabled>

                <label>Status</label>
                <input [(ngModel)]="profile.status" disabled>

            </div>

        </div>

    </div>

    <div class="stats-container">

        <div class="stat-card">
            <h3>Attendance</h3>
            <strong>{{ profile.attendance }}</strong>
        </div>

        <div class="stat-card">
            <h3>Leave Balance</h3>
            <strong>{{ profile.leave_balance }}</strong>
        </div>

        <div class="stat-card">
            <h3>Performance</h3>
            <strong>{{ profile.performance }}</strong>
        </div>

    </div>

    <div class="button-group">

        <button
            class="edit-btn"
            *ngIf="!isEditing"
            (click)="editProfile()">
            Edit Profile
        </button>

        <button
            class="save-btn"
            *ngIf="isEditing"
            (click)="saveProfile()">
            Save Changes
        </button>

        <button
            class="cancel-btn"
            *ngIf="isEditing"
            (click)="cancelEdit()">
            Cancel
        </button>

    </div>

</div>
